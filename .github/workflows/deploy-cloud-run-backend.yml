name: Deploy Sync Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloud-run-backend.yml"
      - "backend/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  IMAGE_NAME: neurodiary-sync

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build container image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Push container image
        run: docker push "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          env_vars: |-
            NEURODIARY_API_TOKEN=${{ secrets.NEURODIARY_API_TOKEN }}
            NEURODIARY_DATABASE_URL=${{ secrets.NEURODIARY_DATABASE_URL }}
            NEURODIARY_CORS_ORIGINS=${{ vars.NEURODIARY_CORS_ORIGINS }}
            NEURODIARY_DEFAULT_USER_ID=${{ vars.NEURODIARY_DEFAULT_USER_ID }}
          env_vars_update_strategy: merge
          flags: >-
            --port=8080
            --allow-unauthenticated
            ${{ vars.CLOUD_RUN_DEPLOY_FLAGS }}

      - name: Show deployed URL
        run: echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
