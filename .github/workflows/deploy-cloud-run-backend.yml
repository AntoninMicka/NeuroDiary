name: Deploy Sync Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloud-run-backend.yml"
      - "backend/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
  IMAGE_NAME: neurodiary-sync

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build container image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Push container image
        run: docker push "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          env_vars: |-
            NEURODIARY_API_TOKEN=${{ secrets.NEURODIARY_API_TOKEN }}
            NEURODIARY_SESSION_SECRET=${{ secrets.NEURODIARY_SESSION_SECRET }}
            NEURODIARY_DATABASE_URL=${{ secrets.NEURODIARY_DATABASE_URL }}
            NEURODIARY_VAPID_PRIVATE_KEY=${{ secrets.NEURODIARY_VAPID_PRIVATE_KEY }}
            NEURODIARY_PUSH_SCHEDULER_TOKEN=${{ secrets.NEURODIARY_PUSH_SCHEDULER_TOKEN }}
            NEURODIARY_CORS_ORIGINS=${{ vars.NEURODIARY_CORS_ORIGINS }}
            NEURODIARY_GOOGLE_CLIENT_ID=${{ vars.NEURODIARY_GOOGLE_CLIENT_ID }}
            NEURODIARY_APPLE_CLIENT_ID=${{ vars.NEURODIARY_APPLE_CLIENT_ID }}
            NEURODIARY_APPLE_REDIRECT_PATH=${{ vars.NEURODIARY_APPLE_REDIRECT_PATH }}
            NEURODIARY_VAPID_PUBLIC_KEY=${{ vars.NEURODIARY_VAPID_PUBLIC_KEY }}
            NEURODIARY_VAPID_SUBJECT=${{ vars.NEURODIARY_VAPID_SUBJECT }}
            NEURODIARY_PUSH_ENDPOINT_HOSTS=${{ vars.NEURODIARY_PUSH_ENDPOINT_HOSTS }}
            NEURODIARY_ADMIN_EMAILS=${{ vars.NEURODIARY_ADMIN_EMAILS }}
            NEURODIARY_ADMIN_ALERT_EMAIL=${{ vars.NEURODIARY_ADMIN_ALERT_EMAIL }}
            NEURODIARY_GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            NEURODIARY_GCP_REGION=${{ env.GCP_REGION }}
            NEURODIARY_CLOUD_RUN_SERVICE=${{ env.CLOUD_RUN_SERVICE }}
            NEURODIARY_CLOUD_SQL_INSTANCE=${{ vars.NEURODIARY_CLOUD_SQL_INSTANCE }}
            NEURODIARY_GMAIL_SEND_ENABLED=${{ vars.NEURODIARY_GMAIL_SEND_ENABLED }}
            NEURODIARY_GMAIL_OAUTH_VERIFIED=${{ vars.NEURODIARY_GMAIL_OAUTH_VERIFIED }}
            NEURODIARY_MANUAL_BACKUP_LIMIT=${{ vars.NEURODIARY_MANUAL_BACKUP_LIMIT }}
            NEURODIARY_BACKUP_RETENTION_COUNT=${{ vars.NEURODIARY_BACKUP_RETENTION_COUNT }}
            NEURODIARY_VERSION=${{ github.sha }}
          env_vars_update_strategy: merge
          flags: >-
            --port=8080
            --allow-unauthenticated
            --startup-probe=httpGet.path=/readyz,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=5,failureThreshold=12
            --liveness-probe=httpGet.path=/healthz,httpGet.port=8080,initialDelaySeconds=10,timeoutSeconds=3,periodSeconds=30,failureThreshold=3
            ${{ vars.CLOUD_RUN_DEPLOY_FLAGS }}
            --ingress=all
            --default-url

      - name: Show effective Cloud Run configuration
        run: |
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" \
            --format=json |
            jq '{
              ingress: .metadata.annotations["run.googleapis.com/ingress"],
              defaultUrlDisabled: .metadata.annotations["run.googleapis.com/default-url-disabled"],
              url: .status.url,
              addressUrl: .status.address.url,
              traffic: .status.traffic
            }'

      - name: Ensure public Cloud Run invocation
        run: |
          gcloud run services add-iam-policy-binding "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet

          gcloud run services get-iam-policy "${CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" \
            --format=json |
            jq '{
              publicInvoker: any(
                .bindings[]?;
                .role == "roles/run.invoker" and
                any(.members[]?; . == "allUsers")
              ),
              bindings: [
                .bindings[]? |
                select(.role == "roles/run.invoker")
              ]
            }'

      - name: Check public Cloud Run endpoint
        env:
          CONFIGURED_SERVICE_URL: ${{ vars.CLOUD_RUN_PUBLIC_URL }}
          DEPLOYED_SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          SERVICE_URL="${CONFIGURED_SERVICE_URL:-${DEPLOYED_SERVICE_URL}}"
          SERVICE_URL="${SERVICE_URL%/}"

          if [ -z "${SERVICE_URL}" ]; then
            echo "::error::Cloud Run deploy did not return a URL and CLOUD_RUN_PUBLIC_URL is not configured."
            exit 1
          fi

          echo "Verifying Cloud Run service at ${SERVICE_URL}"

          for endpoint in /healthz /readyz /api/v1/meta; do
            echo "Checking ${SERVICE_URL}${endpoint}"
            response_file="$(mktemp)"
            if ! status_code="$(
              curl --silent --show-error \
                --retry 8 --retry-delay 5 --retry-connrefused \
                --output "${response_file}" \
                --write-out "%{http_code}" \
                "${SERVICE_URL}${endpoint}"
            )"; then
              status_code="000"
            fi

            if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
              echo "::warning::Public endpoint ${endpoint} returned HTTP ${status_code}. The deployed revision already passed its mandatory Cloud Run startup and liveness probes."
              sed -n '1,40p' "${response_file}"
              break
            fi

            sed -n '1,40p' "${response_file}"
            echo
          done

      - name: Show deployed URL
        run: |
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}"
